server:
  port: ${PORT:8080}

spring:
  application:
    name: noduq-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

noduq:
  cors:
    origins: ${NODUQ_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://noduq.app,https://www.noduq.app}
  supabase:
    url: ${SUPABASE_URL:https://gthbmxvefblwajeposrx.supabase.co}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  firebase:
    credentials: ${FIREBASE_CREDENTIALS:}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:https://api.noduq.app/v1/gmail/callback}
    app-redirect: ${GMAIL_APP_REDIRECT:com.noduq.app://gmail-callback}
    web-redirect: ${GMAIL_WEB_REDIRECT:https://noduq.app/cuenta}
    poll-ms: ${GMAIL_POLL_MS:45000}
  billing:
    webhook-auth: ${REVENUECAT_WEBHOOK_AUTH:}
    secret-api-key: ${REVENUECAT_SECRET_API_KEY:}
  employee:
    jwt-secret: ${EMPLOYEE_JWT_SECRET:local-dev-employee-jwt-secret-key}
    session-days: 30
    max-login-attempts: 8
    lockout-minutes: 15

logging:
  level:
    com.noduq: INFO
