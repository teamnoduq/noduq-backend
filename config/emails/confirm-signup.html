<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Confirma tu cuenta NODUQ</title>
  </head>
  <body style="margin:0;padding:0;background-color:#021113;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#021113">
      <tr>
        <td align="center" style="padding-top:40px;padding-bottom:40px;padding-left:16px;padding-right:16px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%;max-width:600px;">
            <tr>
              <td style="padding-bottom:28px;">
                <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;letter-spacing:3px;color:#88E7F3;font-weight:bold;">NODUQ</p>
              </td>
            </tr>
            <tr>
              <td bgcolor="#0A2226" style="background-color:#0A2226;padding-top:32px;padding-bottom:32px;padding-left:28px;padding-right:28px;">
                <p style="margin:0 0 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;letter-spacing:2px;color:#88E7F3;">CUENTA</p>
                <h1 style="margin:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:34px;color:#D3F6FB;font-weight:bold;">Confirma tu correo</h1>
                <p style="margin:0 0 20px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#D3F6FB;">
                  Para abrir tu comercio en NODUQ, confirma esta dirección. El aviso de pago QR usa el mismo texto que te llega de Bancolombia, tal cual.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td bgcolor="#88E7F3" style="background-color:#88E7F3;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding-top:14px;padding-bottom:14px;padding-left:22px;padding-right:22px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;color:#021113;text-decoration:none;font-weight:bold;">Confirmar cuenta</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:22px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#8AA8AC;">
                  Si no creaste una cuenta NODUQ, ignora este correo.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding-top:20px;">
                <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#668088;">
                  Para más información:
                  <a href="mailto:team.noduq@gmail.com" style="color:#88E7F3;text-decoration:none;">team.noduq@gmail.com</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
